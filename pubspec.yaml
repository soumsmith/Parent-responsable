  # Versions Firebase compatibles avec Xcode 14.2
  #firebase_core: ^2.27.0
  #firebase_auth: ^4.17.8
  #cloud_firestore: ^4.15.8
  #firebase_storage: ^11.6.9
  #firebase_messaging: ^14.7.10
  #flutter_local_notifications: ^18.0.1


dev_dependencies:
